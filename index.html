<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>职业罗盘 · 大学生职业生涯自我认知测评</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
/* ========== 基础重置与变量 ========== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#2D3561;
  --ink-light:#4A5490;
  --ink-muted:#8B93B8;
  --amber:#E8A33D;
  --amber-light:#F5C77A;
  --cream:#F7F4EE;
  --cream-card:#FFFCF6;
  --line:#E5DFD3;
  --white:#FFFFFF;
  --serif:'Noto Serif SC',Georgia,'Songti SC',serif;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
}
html{font-size:16px;-webkit-tap-highlight-color:transparent}
body{
  font-family:var(--sans);
  background:var(--cream);
  color:var(--ink);
  min-height:100vh;
  overflow-x:hidden;
  line-height:1.6;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hidden{display:none!important}

/* ========== 容器 ========== */
#app{
  max-width:430px;
  margin:0 auto;
  min-height:100vh;
  position:relative;
  padding-bottom:env(safe-area-inset-bottom);
}

/* ========== 选项内部波纹闪光 ========== */
.opt-ripple{
  position:absolute;
  border-radius:50%;
  transform:scale(0);
  animation:optRipple .3s cubic-bezier(.22,.61,.36,1) forwards;
  pointer-events:none;
  z-index:0;
}
@keyframes optRipple{
  to{transform:scale(1)}
}
.quiz-option .opt-dot,
.quiz-option .opt-text,
.quiz-option .opt-degree-bar{position:relative;z-index:1}
/* 闪光瞬间：卡片底色保持不变，由波纹从点击处灌入程度色 */
.quiz-option.selected.flashing{
  border-color:var(--sel);
  background:var(--cream-card);
}
.quiz-option.flashing .opt-label{color:var(--sel-text);transition:color .12s ease .08s}
.quiz-option.flashing .opt-desc{color:var(--sel-sub);transition:color .12s ease .08s}
.quiz-option.flashing .opt-dot{
  border-color:var(--sel);
  background:var(--sel);
  transition:all .12s ease .08s;
}
.quiz-option.flashing .opt-dot::after{
  opacity:1;transform:scale(1);
  background:var(--cream-card);
  transition:all .12s ease .08s;
}
.quiz-option.flashing .opt-degree-bar{opacity:.9;background:var(--sel-text)!important}

/* ========== 通用动效 ========== */
.view{
  animation:fadeUp .45s cubic-bezier(.22,.61,.36,1);
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes fadeIn{
  from{opacity:0}to{opacity:1}
}
@keyframes pulseRing{
  0%{transform:scale(1);opacity:.6}
  100%{transform:scale(1.8);opacity:0}
}

/* ========== 首页 ========== */
#view-home{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  padding:48px 28px 32px;
  position:relative;
  overflow:hidden;
}
.home-bg-deco{
  position:absolute;
  top:-80px;right:-80px;
  width:280px;height:280px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(232,163,61,.12) 0%,transparent 70%);
  pointer-events:none;
}
.home-bg-deco2{
  position:absolute;
  bottom:-60px;left:-60px;
  width:220px;height:220px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(45,53,97,.08) 0%,transparent 70%);
  pointer-events:none;
}
.home-compass{
  width:72px;height:72px;
  margin:0 auto 28px;
  position:relative;
}
.home-compass svg{width:100%;height:100%}
.home-compass::after{
  content:'';
  position:absolute;
  inset:0;
  border-radius:50%;
  border:1.5px solid var(--amber);
  animation:pulseRing 2.4s ease-out infinite;
}
.home-eyebrow{
  text-align:center;
  font-size:11px;
  letter-spacing:.35em;
  color:var(--amber);
  text-transform:uppercase;
  margin-bottom:14px;
  font-weight:500;
}
.home-title{
  font-family:var(--serif);
  font-size:30px;
  font-weight:700;
  text-align:center;
  line-height:1.35;
  color:var(--ink);
  margin-bottom:8px;
}
.home-subtitle{
  text-align:center;
  font-size:14px;
  color:var(--ink-muted);
  margin-bottom:36px;
  line-height:1.7;
}
.home-card{
  background:var(--cream-card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:22px 20px;
  margin-bottom:24px;
}
.home-card-row{
  display:flex;
  align-items:center;
  gap:14px;
  padding:10px 0;
}
.home-card-row+.home-card-row{border-top:1px dashed var(--line)}
.home-card-icon{
  width:36px;height:36px;
  border-radius:10px;
  background:var(--ink);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.home-card-icon svg{width:18px;height:18px;stroke:var(--amber);fill:none;stroke-width:1.8}
.home-card-text{flex:1}
.home-card-label{font-size:13px;font-weight:500;color:var(--ink)}
.home-card-desc{font-size:11px;color:var(--ink-muted);margin-top:2px}
.home-start-btn{
  width:100%;
  padding:16px;
  background:var(--ink);
  color:var(--cream);
  border-radius:14px;
  font-size:16px;
  font-weight:500;
  letter-spacing:.05em;
  transition:transform .15s,box-shadow .2s;
  box-shadow:0 6px 20px rgba(45,53,97,.25);
}
.home-start-btn:active{transform:scale(.97)}
.home-start-btn .arrow{
  display:inline-block;
  margin-left:8px;
  transition:transform .2s;
}
.home-start-btn:hover .arrow{transform:translateX(4px)}
.home-footer{
  text-align:center;
  font-size:11px;
  color:var(--ink-muted);
  margin-top:auto;
  padding-top:24px;
}

/* ========== 答题页 ========== */
#view-quiz{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  padding:14px 20px 22px;
}
.quiz-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}
.quiz-back{
  width:36px;height:36px;
  border-radius:50%;
  background:var(--cream-card);
  border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.quiz-back:active{background:var(--line)}
.quiz-back svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:2}
.quiz-progress-text{
  font-size:13px;
  color:var(--ink-muted);
  font-weight:500;
}
.quiz-progress-text b{color:var(--ink);font-size:16px;font-weight:700}
.quiz-progress-track{
  height:4px;
  background:var(--line);
  border-radius:2px;
  margin-bottom:20px;
  overflow:hidden;
}
.quiz-progress-fill{
  height:100%;
  background:linear-gradient(90deg,var(--amber),var(--amber-light));
  border-radius:2px;
  transition:width .4s cubic-bezier(.22,.61,.36,1);
  width:0%;
}
.quiz-node-row{
  display:flex;
  justify-content:space-between;
  margin-bottom:18px;
  padding:0 2px;
  gap:3px;
}
.quiz-node{
  flex:1;
  height:5px;
  border-radius:3px;
  background:var(--line);
  transition:background .3s;
}
.quiz-node.done{background:var(--amber-light)}
.quiz-node.current{background:var(--ink)}
.quiz-question-num{
  font-family:var(--serif);
  font-size:12px;
  color:var(--amber);
  letter-spacing:.15em;
  margin-bottom:8px;
  font-weight:600;
}
.quiz-question-text{
  font-family:var(--serif);
  font-size:18px;
  font-weight:600;
  line-height:1.55;
  color:var(--ink);
  margin-bottom:18px;
}
.quiz-options{
  display:flex;
  flex-direction:column;
  gap:6px;
  flex:1;
}
.quiz-option{
  display:flex;
  align-items:center;
  gap:11px;
  padding:8px 14px;
  background:var(--cream-card);
  border:1.5px solid var(--line);
  border-radius:11px;
  transition:background .2s,border-color .2s,transform .1s;
  position:relative;
  overflow:hidden;
  min-height:46px;
  /* 选中色由JS按程度注入 */
  --sel:#2D3561;
  --sel-text:#F7F4EE;
  --sel-sub:rgba(247,244,238,.7);
}
.quiz-option:active{transform:scale(.98)}
.quiz-option.selected{
  border-color:var(--sel);
  background:var(--sel);
}
.quiz-option.selected .opt-label{color:var(--sel-text)}
.quiz-option.selected .opt-desc{color:var(--sel-sub)}
.quiz-option.selected .opt-dot{
  border-color:var(--sel-text);
  background:var(--sel-text);
}
.quiz-option.selected .opt-dot::after{
  opacity:1;transform:scale(1);
  background:var(--sel);
}
.opt-dot{
  width:17px;height:17px;
  border-radius:50%;
  border:2px solid var(--ink-muted);
  flex-shrink:0;
  position:relative;
  transition:all .2s;
}
.opt-dot::after{
  content:'';
  position:absolute;
  inset:3px;
  border-radius:50%;
  background:var(--ink);
  opacity:0;
  transform:scale(0);
  transition:all .2s;
}
.opt-text{flex:1;line-height:1.25}
.opt-label{
  font-size:13.5px;
  font-weight:500;
  color:var(--ink);
  transition:color .2s;
  line-height:1.3;
}
.opt-desc{
  font-size:10.5px;
  color:var(--ink-muted);
  margin-top:1px;
  transition:color .2s;
  line-height:1.25;
}
.opt-degree-bar{
  width:4px;
  height:22px;
  border-radius:2px;
  flex-shrink:0;
  opacity:.35;
  transition:opacity .2s,background .2s;
}
.quiz-option.selected .opt-degree-bar{opacity:.9;background:var(--sel-text)!important}

.quiz-nav{
  display:flex;
  gap:12px;
  margin-top:16px;
}
.quiz-btn{
  flex:1;
  padding:12px;
  border-radius:12px;
  font-size:15px;
  font-weight:500;
  transition:all .15s;
}
.quiz-btn:active{transform:scale(.97)}
.quiz-btn-prev{
  background:var(--cream-card);
  border:1.5px solid var(--line);
  color:var(--ink-muted);
}
.quiz-btn-prev:disabled{opacity:.4;cursor:not-allowed}
.quiz-btn-next{
  background:var(--ink);
  color:var(--cream);
  box-shadow:0 4px 14px rgba(45,53,97,.2);
}
.quiz-btn-next:disabled{
  opacity:.4;
  box-shadow:none;
  cursor:not-allowed;
}

/* ========== 结果页 ========== */
#view-result{
  min-height:100vh;
  padding:32px 24px 40px;
}
.result-header{
  text-align:center;
  margin-bottom:28px;
}
.result-eyebrow{
  font-size:11px;
  letter-spacing:.3em;
  color:var(--amber);
  text-transform:uppercase;
  margin-bottom:10px;
  font-weight:500;
}
.result-role{
  font-family:var(--serif);
  font-size:28px;
  font-weight:700;
  color:var(--ink);
  margin-bottom:6px;
}
.result-role-en{
  font-size:12px;
  color:var(--ink-muted);
  letter-spacing:.1em;
}
.result-desc{
  font-size:14px;
  color:var(--ink-light);
  line-height:1.8;
  background:var(--cream-card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px 18px;
  margin-bottom:28px;
}
.result-section-title{
  font-family:var(--serif);
  font-size:16px;
  font-weight:600;
  color:var(--ink);
  margin-bottom:16px;
  display:flex;
  align-items:center;
  gap:10px;
}
.result-section-title::before{
  content:'';
  width:3px;height:16px;
  background:var(--amber);
  border-radius:2px;
}
.radar-wrap{
  background:var(--cream-card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:20px 16px 16px;
  margin-bottom:28px;
  display:flex;
  justify-content:center;
}
.radar-wrap svg{width:100%;max-width:320px;height:auto}
.dim-list{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-bottom:28px;
}
.dim-item{
  background:var(--cream-card);
  border:1px solid var(--line);
  border-radius:10px;
  padding:9px 13px;
}
.dim-item-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:6px;
}
.dim-name{
  font-size:12px;
  font-weight:500;
  color:var(--ink);
}
.dim-pct{
  font-size:12px;
  font-weight:700;
  color:var(--amber);
  font-family:var(--serif);
  font-variant-numeric:tabular-nums;
}
.dim-bar-track{
  height:4px;
  background:var(--line);
  border-radius:2px;
  overflow:hidden;
}
.dim-bar-fill{
  height:100%;
  border-radius:2px;
  background:linear-gradient(90deg,var(--ink),var(--ink-light));
  transition:width 1s cubic-bezier(.22,.61,.36,1);
  width:0%;
}
.dim-item.top .dim-bar-fill{
  background:linear-gradient(90deg,var(--amber),var(--amber-light));
}
.career-card{
  background:var(--ink);
  border-radius:14px;
  padding:22px 20px;
  margin-bottom:20px;
  color:var(--cream);
}
.career-card .result-section-title{color:var(--cream)}
.career-card .result-section-title::before{background:var(--amber)}
.career-text{
  font-size:13px;
  line-height:1.8;
  color:rgba(247,244,238,.85);
}
.career-tags{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:14px;
}
.career-tag{
  font-size:11px;
  padding:5px 12px;
  border-radius:20px;
  background:rgba(232,163,61,.2);
  color:var(--amber-light);
  border:1px solid rgba(232,163,61,.3);
}
.insight-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:28px;
}
.insight-box{
  background:var(--cream-card);
  border:1px solid var(--line);
  border-radius:12px;
  padding:16px 14px;
}
.insight-box.strength{border-left:3px solid var(--amber)}
.insight-box.watchout{border-left:3px solid var(--ink-muted)}
.insight-label{
  font-size:11px;
  color:var(--ink-muted);
  margin-bottom:6px;
  letter-spacing:.05em;
}
.insight-text{
  font-size:12px;
  color:var(--ink-light);
  line-height:1.6;
}
.result-actions{
  display:flex;
  gap:12px;
}
.result-btn{
  flex:1;
  padding:14px;
  border-radius:12px;
  font-size:14px;
  font-weight:500;
  transition:all .15s;
}
.result-btn:active{transform:scale(.97)}
.result-btn-restart{
  background:var(--cream-card);
  border:1.5px solid var(--line);
  color:var(--ink);
}
.result-btn-share{
  background:var(--ink);
  color:var(--cream);
}

/* ========== Toast ========== */
.toast{
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  background:rgba(45,53,97,.92);
  color:var(--cream);
  padding:12px 24px;
  border-radius:10px;
  font-size:14px;
  z-index:999;
  animation:fadeIn .2s;
  backdrop-filter:blur(4px);
}

/* ========== 低调署名 ========== */
.kaisu-mark{
  text-align:center;
  font-size:9px;
  letter-spacing:.5em;
  color:var(--ink-muted);
  opacity:.35;
  padding:20px 0 8px;
  font-weight:500;
  user-select:none;
}
</style>
</head>
<body>
<div id="app">

  <!-- ========== 首页 ========== -->
  <section id="view-home" class="view">
    <div class="home-bg-deco"></div>
    <div class="home-bg-deco2"></div>
    <div class="home-compass">
      <svg viewBox="0 0 72 72" fill="none">
        <circle cx="36" cy="36" r="34" stroke="#2D3561" stroke-width="1.5" opacity=".3"/>
        <circle cx="36" cy="36" r="26" stroke="#2D3561" stroke-width="1" opacity=".2" stroke-dasharray="3 3"/>
        <polygon points="36,14 40,36 36,58 32,36" fill="#E8A33D" opacity=".9"/>
        <polygon points="36,14 40,36 36,36" fill="#2D3561"/>
        <circle cx="36" cy="36" r="4" fill="#2D3561"/>
        <circle cx="36" cy="36" r="2" fill="#E8A33D"/>
        <text x="36" y="10" text-anchor="middle" font-size="7" fill="#2D3561" font-family="serif" font-weight="700">N</text>
      </svg>
    </div>
    <div class="home-eyebrow">CAREER COMPASS</div>
    <h1 class="home-title">职业罗盘<br>自我认知测评</h1>
    <p class="home-subtitle">60道题，探索你的职业性格底色<br>找到属于你的成长方向</p>

    <div class="home-card">
      <div class="home-card-row">
        <div class="home-card-icon">
          <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        </div>
        <div class="home-card-text">
          <div class="home-card-label">60道精选题目</div>
          <div class="home-card-desc">覆盖8大职业性格维度，含反向校验题</div>
        </div>
      </div>
      <div class="home-card-row">
        <div class="home-card-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
        </div>
        <div class="home-card-text">
          <div class="home-card-label">7级直觉选择</div>
          <div class="home-card-desc">从「完全就是我」到「完全不是我」</div>
        </div>
      </div>
      <div class="home-card-row">
        <div class="home-card-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <div class="home-card-text">
          <div class="home-card-label">8类职业画像</div>
          <div class="home-card-desc">雷达图+维度占比+发展建议</div>
        </div>
      </div>
    </div>

    <button class="home-start-btn" onclick="startQuiz()">
      开始探索<span class="arrow">→</span>
    </button>
    <div class="home-footer">凭第一直觉作答 · 约需6-8分钟 · 结果仅供参考</div>
  </section>

  <!-- ========== 答题页 ========== -->
  <section id="view-quiz" class="view hidden">
    <div class="quiz-top">
      <button class="quiz-back" onclick="goHome()" aria-label="返回">
        <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <div class="quiz-progress-text"><b id="q-current">1</b> / 60</div>
    </div>
    <div class="quiz-progress-track">
      <div class="quiz-progress-fill" id="progress-fill"></div>
    </div>
    <div class="quiz-node-row" id="node-row"></div>

    <div class="quiz-question-num" id="q-num">QUESTION 01</div>
    <div class="quiz-question-text" id="q-text"></div>

    <div class="quiz-options" id="options-wrap"></div>

    <div class="quiz-nav">
      <button class="quiz-btn quiz-btn-prev" id="btn-prev" onclick="prevQuestion()">上一题</button>
      <button class="quiz-btn quiz-btn-next" id="btn-next" onclick="nextQuestion()" disabled>下一题</button>
    </div>
  </section>

  <!-- ========== 结果页 ========== -->
  <section id="view-result" class="view hidden">
    <div class="result-header">
      <div class="result-eyebrow">YOUR PROFILE</div>
      <div class="result-role" id="result-role"></div>
      <div class="result-role-en" id="result-role-en"></div>
    </div>

    <div class="result-desc" id="result-desc"></div>

    <div class="result-section-title">八维特征雷达</div>
    <div class="radar-wrap">
      <svg id="radar-svg" viewBox="0 0 320 320"></svg>
    </div>

    <div class="result-section-title">各维度占比</div>
    <div class="dim-list" id="dim-list"></div>

    <div class="insight-grid">
      <div class="insight-box strength">
        <div class="insight-label">核心优势</div>
        <div class="insight-text" id="insight-strength"></div>

/* ========== 视图切换 ========== */
function showView(id){

/* ========== 开始答题 ========== */
function startQuiz(){
  currentIdx=0;
  answers.fill(null);
  renderNodes();
  renderQuestion();
  showView('view-quiz');
}

/* ========== 渲染节点进度（12段，每段5题） ========== */
function renderNodes(){
  const row = document.getElementById('node-row');
  row.innerHTML='';
  const segCount = 12;
  for(let i=0;i<segCount;i++){
    const node = document.createElement('div');
    node.className='quiz-node';
    node.id='node-'+i;
    row.appendChild(node);
  }
}

function updateNodes(){
  const segCount = 12;
  const segment = Math.floor(currentIdx / (TOTAL/segCount));
  for(let i=0;i<segCount;i++){
    const node = document.getElementById('node-'+i);
    if(!node) continue;
    node.className='quiz-node';
    if(i < segment) node.classList.add('done');
    else if(i === segment) node.classList.add('current');
  }
}

/* ========== 渲染题目 ========== */
function renderQuestion(){
  const q = QUESTIONS[currentIdx];
  document.getElementById('q-current').textContent = currentIdx+1;
  document.getElementById('q-num').textContent = 'QUESTION ' + String(currentIdx+1).padStart(2,'0');
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('progress-fill').style.width = (currentIdx/TOTAL*100)+'%';
  updateNodes();

  const wrap = document.getElementById('options-wrap');
  wrap.innerHTML='';
  OPTIONS.forEach((opt,idx)=>{
    const div = document.createElement('div');
    const isSel = answers[currentIdx]===idx;
    div.className = 'quiz-option' + (isSel?' selected':'');
    div.style.setProperty('--sel', opt.color);
    div.innerHTML = `
      <div class="opt-dot"></div>
      <div class="opt-text">
        <div class="opt-label">${opt.label}</div>
        <div class="opt-desc">${opt.desc}</div>
      </div>
      <div class="opt-degree-bar" style="background:${opt.bar}"></div>
    `;
    div.onclick = (e)=>selectOption(idx,e);
    wrap.appendChild(div);
  });

  document.getElementById('btn-prev').disabled = currentIdx===0;
  document.getElementById('btn-next').disabled = answers[currentIdx]===null;
  document.getElementById('btn-next').textContent = currentIdx===TOTAL-1?'查看结果':'下一题';
}

/* ========== 选项内部程度色波纹闪光 ========== */
function playOptionRipple(optionEl, color, ev){
  // 清除残留波纹
  optionEl.querySelectorAll('.opt-ripple').forEach(r=>r.remove());
  const rect = optionEl.getBoundingClientRect();
  // 波纹直径取选项对角线的2.2倍，保证从点击处扩散能铺满整张卡片
  const size = Math.ceil(Math.hypot(rect.width, rect.height) * 2.2);
  const ripple = document.createElement('span');
  ripple.className = 'opt-ripple';
  ripple.style.width = size+'px';
  ripple.style.height = size+'px';
  ripple.style.background = color;
  // 以点击位置为圆心（无事件时取卡片中心）
  const cx = ev ? (ev.clientX - rect.left) : rect.width/2;
  const cy = ev ? (ev.clientY - rect.top) : rect.height/2;
  ripple.style.left = (cx - size/2)+'px';
  ripple.style.top = (cy - size/2)+'px';
  optionEl.appendChild(ripple);
}

/* ========== 选择选项 ========== */
function selectOption(idx, ev){
  if(isTransitioning) return;
  answers[currentIdx]=idx;
  const opt = OPTIONS[idx];
  // 重绘选项（此时不显示为selected实心态）
  renderQuestion();
  // 只在被点中的选项内部播放程度色波纹
  const optionEls = document.querySelectorAll('#options-wrap .quiz-option');
  const target = optionEls[idx];
  if(target){
    target.classList.add('flashing');
    playOptionRipple(target, opt.color, ev);
  }
  isTransitioning = true;
  // 波纹铺满卡片后切换题目，重绘即恢复
  setTimeout(()=>{
    if(currentIdx < TOTAL-1){
      currentIdx++;
      renderQuestion();
    }else{
      showResult();
    }
    isTransitioning=false;
  },320);
}

function prevQuestion(){
  if(currentIdx>0){
    currentIdx--;
    renderQuestion();
  }
}

function nextQuestion(){
  if(answers[currentIdx]===null){
    showToast('请先选择一个选项');
    return;
  }
  if(currentIdx < TOTAL-1){
    currentIdx++;
    renderQuestion();
  }else{
    showResult();
  }
}

/* ========== 计算结果（反向题取反） ========== */
function calcScores(){
  const scores = {};
  DIM_ORDER.forEach(d=>scores[d]=0);
  for(let i=0;i<TOTAL;i++){
    if(answers[i]===null) continue;
    let score = OPTIONS[answers[i]].score;
    if(QUESTIONS[i].rev) score = -score;
    scores[QUESTIONS[i].dim] += score;
  }
  return scores;
}

function showResult(){
  document.getElementById('progress-fill').style.width='100%';
  const scores = calcScores();

  let topDim = DIM_ORDER[0];
  let maxScore = -Infinity;
  DIM_ORDER.forEach(d=>{
    if(scores[d]>maxScore){maxScore=scores[d];topDim=d;}
  });
  const role = ROLES[topDim];

  const totalAbs = DIM_ORDER.reduce((s,d)=>s+Math.abs(scores[d]),0);
  const percents = {};
  DIM_ORDER.forEach(d=>{
    percents[d] = totalAbs===0 ? 12.5 : Math.abs(scores[d])/totalAbs*100;
  });

  document.getElementById('result-role').textContent = role.name;
  document.getElementById('result-role-en').textContent = role.en;
  document.getElementById('result-desc').textContent = role.desc;
  document.getElementById('insight-strength').textContent = role.strength;
  document.getElementById('insight-watchout').textContent = role.watchout;
  document.getElementById('career-text').textContent = role.career;

  const tagsWrap = document.getElementById('career-tags');
  tagsWrap.innerHTML='';
  role.tags.forEach(t=>{
    const span = document.createElement('span');
    span.className='career-tag';
    span.textContent=t;
    tagsWrap.appendChild(span);
  });

  renderRadar(scores, topDim);

  const dimList = document.getElementById('dim-list');
  dimList.innerHTML='';
  const sorted = [...DIM_ORDER].sort((a,b)=>percents[b]-percents[a]);
  sorted.forEach((d)=>{
    const item = document.createElement('div');
    item.className = 'dim-item' + (d===topDim?' top':'');
    item.innerHTML = `
      <div class="dim-item-top">
        <span class="dim-name">${DIMS[d].name}</span>
        <span class="dim-pct">${percents[d].toFixed(2)}%</span>
      </div>
      <div class="dim-bar-track">
        <div class="dim-bar-fill" data-width="${percents[d].toFixed(2)}%"></div>
      </div>
    `;
    dimList.appendChild(item);
  });

  showView('view-result');

  setTimeout(()=>{
    document.querySelectorAll('.dim-bar-fill').forEach(el=>{
      el.style.width = el.dataset.width;
    });
  },100);
}

/* ========== 雷达图渲染 ========== */
function renderRadar(scores, topDim){
  const svg = document.getElementById('radar-svg');
  const cx=160, cy=160, maxR=110;
  const n = 8;
  const angleStep = (Math.PI*2)/n;
  const startAngle = -Math.PI/2;
  const maxAbs = Math.max(...DIM_ORDER.map(d=>Math.abs(scores[d])), 1);

  let html = '';
  for(let layer=1;layer<=4;layer++){
    const r = maxR*layer/4;
    let points = [];
    for(let i=0;i<n;i++){
      const angle = startAngle + i*angleStep;
      points.push((cx+r*Math.cos(angle))+','+(cy+r*Math.sin(angle)));
    }
    html += `<polygon points="${points.join(' ')}" fill="none" stroke="#E5DFD3" stroke-width="1"/>`;
  }
  for(let i=0;i<n;i++){
    const angle = startAngle + i*angleStep;
    const x2 = cx+maxR*Math.cos(angle);
    const y2 = cy+maxR*Math.sin(angle);
    html += `<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="#E5DFD3" stroke-width="1"/>`;
  }
  let dataPoints = [];
  for(let i=0;i<n;i++){
    const d = DIM_ORDER[i];
    const val = Math.abs(scores[d])/maxAbs;
    const r = maxR * Math.max(val, 0.15);
    const angle = startAngle + i*angleStep;
    dataPoints.push((cx+r*Math.cos(angle))+','+(cy+r*Math.sin(angle)));
  }
  html += `<polygon points="${dataPoints.join(' ')}" fill="rgba(232,163,61,.25)" stroke="#E8A33D" stroke-width="2"/>`;
  for(let i=0;i<n;i++){
    const d = DIM_ORDER[i];
    const val = Math.abs(scores[d])/maxAbs;
    const r = maxR * Math.max(val, 0.15);
    const angle = startAngle + i*angleStep;
    const px = cx+r*Math.cos(angle);
    const py = cy+r*Math.sin(angle);
    const isTop = d===topDim;
    html += `<circle cx="${px}" cy="${py}" r="${isTop?5:3.5}" fill="${isTop?'#E8A33D':'#2D3561'}"/>`;
  }
  for(let i=0;i<n;i++){
    const d = DIM_ORDER[i];
    const angle = startAngle + i*angleStep;
    const labelR = maxR + 22;
    const lx = cx+labelR*Math.cos(angle);
    const ly = cy+labelR*Math.sin(angle);
    const isTop = d===topDim;
    const anchor = Math.abs(Math.cos(angle))<0.3 ? 'middle' : (Math.cos(angle)>0?'start':'end');
    html += `<text x="${lx}" y="${ly}" text-anchor="${anchor}" dominant-baseline="middle"
      font-size="11" font-family="'Noto Sans SC',sans-serif"
      fill="${isTop?'#E8A33D':'#4A5490'}" font-weight="${isTop?'700':'400'}">${DIMS[d].name}</text>`;
  }
  svg.innerHTML = html;
}

/* ========== 重新测评 ========== */
function restart(){
  currentIdx=0;
  answers.fill(null);
  showView('view-home');
}

/* ========== 保存结果 ========== */
function shareResult(){
  showToast('请截图保存你的测评结果');
}

/* ========== Toast ========== */
function showToast(msg){
  const existing = document.querySelector('.toast');
  if(existing) existing.remove();
  const t = document.createElement('div');
  t.className='toast';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),1800);
}

/* ========== 键盘支持 ========== */
document.addEventListener('keydown',(e)=>{
  if(document.getElementById('view-quiz').classList.contains('hidden')) return;
  if(e.key>='1'&&e.key<='7'){
    const idx = parseInt(e.key)-1;
    if(idx<OPTIONS.length) selectOption(idx);
  }
  if(e.key==='ArrowLeft') prevQuestion();
  if(e.key==='ArrowRight') nextQuestion();
});
</script>
